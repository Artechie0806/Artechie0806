<clipPath id="c0"><rect x="12" y="12" width="312" height="248"/></clipPath><clipPath id="c1"><rect x="344" y="12" width="312" height="248"/></clipPath><clipPath id="c2"><rect x="676" y="12" width="312" height="248"/></clipPath>
