  <g class="fade" style="animation-delay:.5s"><text x="970.0" y="42.0" font-family="'Trebuchet MS', 'Segoe UI', Tahoma, Verdana, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="1.6" fill="#15120F" text-anchor="end" textLength="190" lengthAdjust="spacingAndGlyphs" >NO. 01  &#183;  NAVI MUMBAI</text></g>
