  <g class="fade" style="animation-delay:.5s"><text x="970.0" y="42.0" font-family="'Trebuchet MS', 'Segoe UI', Tahoma, Verdana, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="1.6" fill="#15120F" text-anchor="end" textLength="168" lengthAdjust="spacingAndGlyphs" >NAVI MUMBAI, INDIA</text></g>
  <g transform="translate(76.0,108.0)"><g class="pop" style="animation-delay:0.25s"><g transform="translate(-76.0,-108.0)"><path d="M 28.8 62.4 L 62.0 63.1 L 92.0 61.7 L 122.7 62.2 L 121.8 93.6 L 120.8 124.0 L 120.7 154.3 L 91.3 153.2 L 61.2 154.0 L 30.3 155.2 L 29.3 122.0 L 29.4 93.2 Z" fill="#F4F0E4" stroke="#15120F" stroke-width="3" stroke-linejoin="round"/><text x="76.0" y="120.0" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Franklin Gothic Heavy', sans-serif" font-size="44" font-weight="bold" letter-spacing="0.4" fill="#15120F" text-anchor="middle" textLength="58" lengthAdjust="spacingAndGlyphs" >AR.</text><line x1="40" y1="130" x2="112" y2="130" stroke="#DE3226" stroke-width="3"/><text x="76.0" y="146.0" font-family="'Trebuchet MS', 'Segoe UI', Tahoma, Verdana, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.4" fill="#15120F" text-anchor="middle" >AI / ML</text></g></g></g>
  <g transform="translate(148.0,130.0)"><g class="pop" style="animation-delay:0.12s"><g transform="translate(-148.0,-130.0)"><text x="153.0" y="157.0" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Franklin Gothic Heavy', sans-serif" font-size="76" font-weight="bold" letter-spacing="1" fill="#DE3226" text-anchor="start" textLength="452" lengthAdjust="spacingAndGlyphs" >ARYAN RANE</text><text x="148.0" y="152.0" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Franklin Gothic Heavy', sans-serif" font-size="76" font-weight="bold" letter-spacing="1" fill="#15120F" text-anchor="start" textLength="452" lengthAdjust="spacingAndGlyphs" >ARYAN RANE</text></g></g></g>
