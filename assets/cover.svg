  <line x1="946" y1="107" x2="692" y2="107" stroke="#15120F" stroke-width="1.5" stroke-linecap="round" opacity="0.22" pathLength="1" class="draw" style="animation-delay:0.15s"/>
  <line x1="961" y1="118" x2="717" y2="118" stroke="#15120F" stroke-width="2.1" stroke-linecap="round" opacity="0.22" pathLength="1" class="draw" style="animation-delay:0.18s"/>
