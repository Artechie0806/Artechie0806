  <line x1="948" y1="140" x2="763" y2="140" stroke="#15120F" stroke-width="1.8" stroke-linecap="round" opacity="0.22" pathLength="1" class="draw" style="animation-delay:0.24s"/>
  <line x1="937" y1="152" x2="800" y2="152" stroke="#15120F" stroke-width="2.5" stroke-linecap="round" opacity="0.22" pathLength="1" class="draw" style="animation-delay:0.27s"/>
