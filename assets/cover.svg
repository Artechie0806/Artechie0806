  <g transform="translate(858.0,214.0)"><g class="pop" style="animation-delay:0.55s"><g transform="translate(-858.0,-214.0)"><g class="beat" style="transform-origin:858px 214px"><path d="M 858.0 133.7 L 870.3 164.2 L 894.5 144.5 L 891.8 175.9 L 920.4 170.9 L 906.6 195.6 L 937.4 204.4 L 911.7 220.5 L 932.1 242.1 L 903.0 245.1 L 908.8 271.4 L 881.2 258.3 L 876.6 289.4 L 858.0 264.7 L 839.7 288.1 L 834.1 259.6 L 805.8 272.9 L 815.2 243.5 L 786.1 241.3 L 804.4 220.5 L 777.7 204.2 L 809.6 195.7 L 795.9 171.1 L 825.4 177.2 L 820.7 143.0 L 846.2 166.2 Z" fill="#DE3226" stroke="#15120F" stroke-width="3" stroke-linejoin="round"/><text x="858.0" y="202.0" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Franklin Gothic Heavy', sans-serif" font-size="18" font-weight="bold" letter-spacing="1" fill="#F4F0E4" text-anchor="middle" textLength="74" lengthAdjust="spacingAndGlyphs" >OPEN TO</text><text x="858.0" y="230.0" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Franklin Gothic Heavy', sans-serif" font-size="22" font-weight="bold" letter-spacing="1" fill="#F4F0E4" text-anchor="middle" textLength="116" lengthAdjust="spacingAndGlyphs" >AI-ML ROLES!</text></g></g></g></g>
