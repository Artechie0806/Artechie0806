name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # ...and whenever you press the button
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: build the snake svgs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23DE3226&color_dots=%23EFEBDF,%23CFC9BA,%23A29A88,%236B6355,%2315120F
            dist/snake-dark.svg?palette=github-dark&color_snake=%23DE3226&color_dots=%23161b22,%233A3630,%236B6355,%23A29A88,%23EFEBDF

      - name: push them to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
